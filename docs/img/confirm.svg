<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0e1a28" stroke-width="1"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0d2233"/><stop offset=".6" stop-color="#070a0f"/><stop offset="1" stop-color="#04070b"/></radialGradient></defs>
<style>text{font-family:JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.drift{animation:drift 30s linear infinite}@keyframes drift{to{transform:translate(40px,40px)}}
.step{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.march{stroke-dasharray:10 8;animation:march 1.2s linear infinite}@keyframes march{to{stroke-dashoffset:-18}}
.stop{animation:shake 2.4s ease-in-out infinite}@keyframes shake{0%,90%,100%{transform:translateX(0)}93%{transform:translateX(-4px)}96%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<rect width="1280" height="440" fill="url(#vig)"/><rect width="1280" height="440" fill="url(#grid)" class="drift"/>
<text x="640.0" y="58" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="8">SENDS CONFIRM FIRST</text><text x="640.0" y="86" font-size="15" fill="#8694a5" text-anchor="middle" letter-spacing="3">A SEND IS TWO REQUESTS · NOTHING GOES WITHOUT YOU SEEING IT</text><g class="step" style="animation-delay:0.0s"><polygon points="52,130 252,130 252,304 236,320 36,320 36,146" fill="#0b1018" stroke="#00f0ff" stroke-width="2"/><text x="144.0" y="174" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">YOU TAP</text><text x="144.0" y="214" font-size="13.5" fill="#d3dde8" text-anchor="middle">an option, a key,</text><text x="144.0" y="238" font-size="13.5" fill="#d3dde8" text-anchor="middle">a typed line</text><text x="52" y="164" font-size="13" fill="#00f0ff" font-weight="800">1</text></g><path d="M256 225 L280 225" stroke="#00f0ff" stroke-width="9" stroke-opacity=".16" fill="none"/><path class="march" d="M256 225 L280 225" stroke="#00f0ff" stroke-width="3" fill="none"/><g class="step" style="animation-delay:0.18s"><polygon points="300,130 500,130 500,304 484,320 284,320 284,146" fill="#0b1018" stroke="#ffb000" stroke-width="2"/><text x="392.0" y="174" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">PREPARE</text><text x="392.0" y="214" font-size="13.5" fill="#d3dde8" text-anchor="middle">host re-reads the agent,</text><text x="392.0" y="238" font-size="13.5" fill="#d3dde8" text-anchor="middle">returns the exact plan</text><text x="392.0" y="262" font-size="13.5" fill="#d3dde8" text-anchor="middle">+ one-use nonce</text><text x="300" y="164" font-size="13" fill="#ffb000" font-weight="800">2</text></g><path d="M504 225 L528 225" stroke="#ffb000" stroke-width="9" stroke-opacity=".16" fill="none"/><path class="march" d="M504 225 L528 225" stroke="#ffb000" stroke-width="3" fill="none"/><g class="step" style="animation-delay:0.36s"><polygon points="548,130 748,130 748,304 732,320 532,320 532,146" fill="#0b1018" stroke="#7cff00" stroke-width="2"/><text x="640.0" y="174" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">YOU READ IT</text><text x="640.0" y="214" font-size="13.5" fill="#d3dde8" text-anchor="middle">preview sheet · Send is</text><text x="640.0" y="238" font-size="13.5" fill="#d3dde8" text-anchor="middle">dead for 0.7s so a</text><text x="640.0" y="262" font-size="13.5" fill="#d3dde8" text-anchor="middle">stray tap can't confirm</text><text x="548" y="164" font-size="13" fill="#7cff00" font-weight="800">3</text></g><path d="M752 225 L776 225" stroke="#7cff00" stroke-width="9" stroke-opacity=".16" fill="none"/><path class="march" d="M752 225 L776 225" stroke="#7cff00" stroke-width="3" fill="none"/><g class="step" style="animation-delay:0.54s"><polygon points="796,130 996,130 996,304 980,320 780,320 780,146" fill="#0b1018" stroke="#ffb000" stroke-width="2"/><text x="888.0" y="174" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">COMMIT</text><text x="888.0" y="214" font-size="13.5" fill="#d3dde8" text-anchor="middle">agent must still be in</text><text x="888.0" y="238" font-size="13.5" fill="#d3dde8" text-anchor="middle">the SAME state, or</text><text x="888.0" y="262" font-size="13.5" fill="#d3dde8" text-anchor="middle">nothing is sent</text><text x="796" y="164" font-size="13" fill="#ffb000" font-weight="800">4</text></g><path d="M1000 225 L1024 225" stroke="#ffb000" stroke-width="9" stroke-opacity=".16" fill="none"/><path class="march" d="M1000 225 L1024 225" stroke="#ffb000" stroke-width="3" fill="none"/><g class="step" style="animation-delay:0.72s"><polygon points="1044,130 1244,130 1244,304 1228,320 1028,320 1028,146" fill="#0b1018" stroke="#00f0ff" stroke-width="2"/><text x="1136.0" y="174" font-size="20" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">HERDR</text><text x="1136.0" y="214" font-size="13.5" fill="#d3dde8" text-anchor="middle">pane send-keys /</text><text x="1136.0" y="238" font-size="13.5" fill="#d3dde8" text-anchor="middle">agent prompt</text><text x="1136.0" y="262" font-size="13.5" fill="#d3dde8" text-anchor="middle">logged, never retried</text><text x="1044" y="164" font-size="13" fill="#00f0ff" font-weight="800">5</text></g><g class="stop"><path d="M888.0 322 L888.0 356" stroke="#ff4d6d" stroke-width="3" stroke-dasharray="6 5"/><polygon points="784,356 1002,356 1002,396 992,406 774,406 774,366" fill="#2b0f17" stroke="#ff4d6d" stroke-width="2"/><text x="888.0" y="387" font-size="14" font-weight="800" fill="#ff4d6d" text-anchor="middle">MOVED ON → REFUSED</text></g><g><polygon points="46,356 726,356 726,396 716,406 36,406 36,366" fill="none" stroke="#1a2635" stroke-width="2"/><text x="56" y="379" font-size="14.5" fill="#d3dde8"><tspan fill="#ffb000" font-weight="700">Never auto-approves.</tspan> Wake touches idle sessions only.</text><text x="56" y="397" font-size="12.5" fill="#8694a5">Every send is logged: who, what, where, when (sends.jsonl).</text></g></svg>