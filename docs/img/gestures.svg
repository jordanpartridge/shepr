<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0e1a28" stroke-width="1"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0d2233"/><stop offset=".6" stop-color="#070a0f"/><stop offset="1" stop-color="#04070b"/></radialGradient></defs>
<style>text{font-family:JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.drift{animation:drift 30s linear infinite}@keyframes drift{to{transform:translate(40px,40px)}}
.step{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.march{stroke-dasharray:10 8;animation:march 1.2s linear infinite}@keyframes march{to{stroke-dashoffset:-18}}
.rip{animation:rip 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes rip{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.5)}}
.r2{animation-delay:.35s}.r3{animation-delay:.7s}
.hold{animation:hold 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes hold{0%{transform:scale(.5);opacity:.2}60%,100%{transform:scale(1.1);opacity:.9}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<rect width="1280" height="380" fill="url(#vig)"/><rect width="1280" height="380" fill="url(#grid)" class="drift"/>
<text x="640.0" y="58" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="8">MOVE WITH YOUR THUMB</text><text x="640.0" y="86" font-size="15" fill="#8694a5" text-anchor="middle" letter-spacing="3">TAP · DOUBLE-TAP · HOLD · NONE OF THEM EVER SENDS ANYTHING</text><g class="step" style="animation-delay:0.0s"><polygon points="56,120 420,120 420,334 404,350 40,350 40,136" fill="#0b1018" stroke="#00f0ff" stroke-width="2"/><circle class="rip" cx="110" cy="190" r="34" fill="none" stroke="#00f0ff" stroke-width="3"/><circle class="rip r2" cx="110" cy="190" r="34" fill="none" stroke="#00f0ff" stroke-width="3"/><circle cx="110" cy="190" r="11" fill="#00f0ff" filter="url(#glow)"/><text x="180" y="175" font-size="24" font-weight="800" fill="#00f0ff" letter-spacing="3">TAP</text><text x="70" y="250" font-size="15" fill="#d3dde8">row  → open</text><text x="70" y="274" font-size="15" fill="#d3dde8">tab  → switch</text><text x="70" y="298" font-size="15" fill="#d3dde8">title → Go To</text><text x="70" y="322" font-size="15" fill="#d3dde8">◀ ▶  → step</text></g><g class="step" style="animation-delay:0.2s"><polygon points="466,120 830,120 830,334 814,350 450,350 450,136" fill="#0b1018" stroke="#7cff00" stroke-width="2"/><circle class="rip" cx="520" cy="190" r="34" fill="none" stroke="#7cff00" stroke-width="3"/><circle class="rip r3" cx="520" cy="190" r="34" fill="none" stroke="#7cff00" stroke-width="3"/><circle cx="511" cy="190" r="9" fill="#7cff00" filter="url(#glow)"/><circle cx="531" cy="190" r="9" fill="#7cff00" filter="url(#glow)" opacity=".7"/><text x="590" y="175" font-size="24" font-weight="800" fill="#7cff00" letter-spacing="3">DOUBLE-TAP</text><text x="480" y="250" font-size="15" fill="#d3dde8">title → next waiting</text><text x="480" y="274" font-size="15" fill="#d3dde8">tab  → refresh</text><text x="480" y="298" font-size="15" fill="#d3dde8">host chip → clear filter</text></g><g class="step" style="animation-delay:0.4s"><polygon points="876,120 1240,120 1240,334 1224,350 860,350 860,136" fill="#0b1018" stroke="#ffb000" stroke-width="2"/><circle class="hold" cx="930" cy="190" r="38" fill="none" stroke="#ffb000" stroke-width="4" stroke-dasharray="12 8"/><circle cx="930" cy="190" r="12" fill="#ffb000" filter="url(#glow)"/><text x="1000" y="175" font-size="24" font-weight="800" fill="#ffb000" letter-spacing="3">HOLD</text><text x="890" y="250" font-size="15" fill="#d3dde8">row  → peek last lines</text><text x="890" y="274" font-size="15" fill="#d3dde8">title → previous session</text><text x="890" y="298" font-size="15" fill="#d3dde8">◀ ▶  → first / last</text><text x="890" y="322" font-size="15" fill="#d3dde8">tab  → Go To</text></g></svg>