<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0e1a28" stroke-width="1"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0d2233"/><stop offset=".6" stop-color="#070a0f"/><stop offset="1" stop-color="#04070b"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="1" stop-color="#00f0ff" stop-opacity=".55"/></linearGradient>

</defs>
<style>
text{font-family:JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}

.drift{animation:drift 30s linear infinite}@keyframes drift{to{transform:translate(40px,40px)}}
.march{stroke-dasharray:10 8;animation:march 1.2s linear infinite}@keyframes march{to{stroke-dashoffset:-18}}
.march.slow{animation-duration:2.4s}
.node{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.pk{filter:drop-shadow(0 0 6px currentColor)}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1280" height="520" fill="url(#vig)"/><rect width="1280" height="520" fill="url(#grid)" class="drift"/>
