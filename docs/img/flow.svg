0 L660 260"/></circle><circle class="pk" r="6" fill="#ffb000" style="color:#ffb000"><animateMotion dur="1.4s" begin=".8s" repeatCount="indefinite" path="M950 190 L1050 190"/></circle><circle class="pk" r="6" fill="#ffb000" style="color:#ffb000"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite" path="M950 340 L1050 340"/></circle><text x="640" y="62" font-size="30" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="8">HOW IT FITS TOGETHER</text>
