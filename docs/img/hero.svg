<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0e1a28" stroke-width="1"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0d2233"/><stop offset=".6" stop-color="#070a0f"/><stop offset="1" stop-color="#04070b"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset="1" stop-color="#00f0ff" stop-opacity=".55"/></linearGradient>

</defs>
<style>
text{font-family:JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}

.drift{animation:drift 30s linear infinite}@keyframes drift{to{transform:translate(40px,40px)}}
.ring{animation:ring 2s cubic-bezier(.4,.1,.2,1) both}@keyframes ring{from{stroke-dashoffset:520}}
.crook{animation:crook 1.2s cubic-bezier(.4,.1,.2,1) .9s both}@keyframes crook{from{stroke-dasharray:0 300;opacity:0}to{stroke-dasharray:300 0;opacity:1}}
.d{animation:pop .9s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.d1{animation-delay:1.7s}.d2{animation-delay:1.8s}.d3{animation-delay:1.9s}.d4{animation-delay:2.0s}.d5{animation-delay:2.1s}
@keyframes pop{from{opacity:0;transform:scale(.1) translate(40px,-30px)}}

.sweepg{transform-origin:250px 210px;animation:spin 7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.word{animation:rise 1.2s cubic-bezier(.2,.9,.3,1) 1.4s both}@keyframes rise{from{opacity:0;transform:translateX(-24px)}}
.tag{animation:fade 1.2s ease 2.2s both}@keyframes fade{from{opacity:0}}
.chip{animation:fade .8s ease both}
.scan{animation:scan 5s ease-in-out infinite alternate}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(300px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1280" height="420" fill="url(#vig)"/><rect width="1280" height="420" fill="url(#grid)" class="drift"/>

<g class="sweepg" opacity=".9"><path d="M250 210 L250 20 A190 190 0 0 1 384 76 Z" fill="url(#sweep)" opacity=".5"/></g>
<circle cx="250" cy="210" r="150" fill="none" stroke="#1a2635" stroke-width="1.5" stroke-dasharray="3 9"/>
<circle cx="250" cy="210" r="195" fill="none" stroke="#1a2635" stroke-width="1" stroke-dasharray="2 12"/>
<g transform="translate(150,110) scale(1.0)"><g class="logo">
<polygon class="ring" points="100,14 174.7,57 174.7,143 100,186 25.3,143 25.3,57" fill="none" stroke="#00f0ff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="470 40" filter="url(#glow)"/>
<path class="crook" d="M121 158 L121 76 C121 42 80 40 75 68" fill="none" stroke="#00f0ff" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
<circle class="d d1" cx="58" cy="132" r="8" fill="#ffb000"/><circle class="d d2" cx="82" cy="150" r="6.2" fill="#ffb000"/>
<circle class="d d3" cx="47" cy="106" r="5.6" fill="#ffb000"/><circle class="d d4" cx="72" cy="112" r="5" fill="#7cff00"/><circle class="d d5" cx="92" cy="130" r="4.4" fill="#ffb000"/>
</g></g>
<g class="word"><text x="470" y="222" font-size="128" font-weight="800" fill="#fff" letter-spacing="22" filter="url(#glow2)">SHEPR</text></g>
<g class="tag"><text x="476" y="270" font-size="23" fill="#8694a5" letter-spacing="9">HERD YOUR AGENTS FROM YOUR PHONE</text></g>
<g class="chip" style="animation-delay:2.6s"><polygon points="486,314 626.8,314 626.8,344 616.8,354 476,354 476,324" fill="#0b1018" stroke="#00f0ff" stroke-width="1.6"/><text x="551.4" y="340" font-size="14.5" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">TAILNET ONLY</text></g><g class="chip" style="animation-delay:2.7800000000000002s"><polygon points="648.8,314 800.0,314 800.0,344 790.0,354 638.8,354 638.8,324" fill="#0b1018" stroke="#7cff00" stroke-width="1.6"/><text x="719.4" y="340" font-size="14.5" font-weight="700" fill="#7cff00" text-anchor="middle" letter-spacing="1.5">CONFIRM FIRST</text></g><g class="chip" style="animation-delay:2.96s"><polygon points="822.0,314 1035.6,314 1035.6,344 1025.6,354 812.0,354 812.0,324" fill="#0b1018" stroke="#ffb000" stroke-width="1.6"/><text x="923.8" y="340" font-size="14.5" font-weight="700" fill="#ffb000" text-anchor="middle" letter-spacing="1.5">NEVER AUTO-APPROVES</text></g><g class="chip" style="animation-delay:3.14s"><polygon points="1057.6,314 1229.6,314 1229.6,344 1219.6,354 1047.6,354 1047.6,324" fill="#0b1018" stroke="#00f0ff" stroke-width="1.6"/><text x="1138.6" y="340" font-size="14.5" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">DEVICE-KEY AUTH</text></g><g class="scan" opacity=".35"><rect x="0" y="40" width="1280" height="2" fill="#00f0ff" filter="url(#glow)"/></g>
<polygon points="28,6 1274,6 1274,392 1252,414 6,414 6,28" fill="none" stroke="#1a2635" stroke-width="2"/>
<text x="1256" y="398" font-size="14" fill="#8694a5" text-anchor="end" letter-spacing="3"><tspan class="pulse" fill="#7cff00">●</tspan> LIVE ON YOUR TAILNET</text>
</svg>